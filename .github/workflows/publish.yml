name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches package.json version
        run: |
          package_version="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync("package.json", "utf8")).version)')"
          if [ "$GITHUB_REF_NAME" != "v$package_version" ]; then
            printf 'Tag "%s" does not match package.json version "%s"\n' "$GITHUB_REF_NAME" "$package_version" >&2
            exit 1
          fi
      - run: npm install -g npm@^11.5.1
      - run: npm publish --provenance
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          notes="$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")"
          if [ -z "$notes" ]; then
            node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$notes_file"
          else
            printf '%s\n' "$notes" > "$notes_file"
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes_file" --verify-tag
